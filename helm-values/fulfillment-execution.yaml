# fulfillment-execution — Fulfillment Execution bounded context.
#
# Startup: runs postgres.Migrate() before serving.
#
# Kafka: live now that warehouse-infra runs a real Kafka release (kafka.tf).
# The inbound consumer (WorkReleased -> CreateTask) starts unconditionally
# regardless of EVENT_PUBLISHER; with a real broker reachable it now
# actually consumes instead of looping connection failures.
#
# `kafka.enabled: true` also turns on the OUTBOUND TaskCompleted publisher.
#
# Analytics: LEFT OFF here, unlike the other 5 analytics-enabled services.
# This repo's Dockerfile had a real deploy gap -- it never built or copied
# the cmd/fulfillment-projector/cmd/fulfillment-reports binaries the chart's
# own projector-deployment.yaml/reports-deployment.yaml already reference,
# so both pods would CrashLoopBackOff (exec: no such file) the moment
# analytics.enabled flips true. Fix is out for review:
# https://github.com/claudioed/fulfillment-execution/pull/47 . Flip this to
# true (and add fulfillment-execution back to terraform/locals.tf's
# analytics_services set) once that PR is merged and this checkout is
# fast-forwarded past it.

replicaCount: 1

config:
  httpAddr: ":8080"
  eventPublisher: "kafka"

kafka:
  enabled: true
  brokers: "kafka.warehouse-systems.svc.cluster.local:9092"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
